name: Native macOS prototype
on:
  workflow_dispatch:
  push:
    branches: [codex/macos-swift]
jobs:
  appkit:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: sh gui/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SoundConnect-macOS-prototype-frontend
          path: build/macos/
