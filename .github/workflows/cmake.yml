name: Build and test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: RelWithDebInfo
  QT_VERSION: 6.8.3

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            qt_arch: linux_gcc_64
          - os: macos-14
            qt_arch: clang_64
          - os: windows-2022
            qt_arch: win64_msvc2022_64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux Bluetooth dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libbluetooth-dev libdbus-1-dev

      - name: Select compatible Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DBUILD_TESTING=ON
          -DMDR_ENABLE_CODEGEN=OFF

      - name: Build
        # The GUI, QML test module, and C++ tests compile several Qt-heavy
        # translation units. Keep hosted runners below their memory limit.
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2

      - name: Test
        run: >
          ctest --test-dir build
          -C ${{ env.BUILD_TYPE }}
          --output-on-failure
