name: Package release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  QT_VERSION: 6.8.3

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate version and release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)"
          test -n "$version"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "${GITHUB_REF_NAME}" = "v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Validate translations and icons
        run: |
          python3 packaging/validate_translations.py
          python3 packaging/generate_icons.py --validate-only
          python3 packaging/validate_package_metadata.py

  windows:
    needs: validate
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DBUILD_TESTING=ON
          -DMDR_ENABLE_CODEGEN=OFF

      - name: Build and test
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2
          ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Package EXE installer
        run: cpack --config build/CPackConfig.cmake -C ${{ env.BUILD_TYPE }} -B dist

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/SonyHeadphonesClient-${{ needs.validate.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: x86_64
    # Qt 6.8.3's prebuilt macOS package still references the AGL framework,
    # which is absent from the newest Xcode SDK used by macos-latest.
    # The standard macos-14 runner is arm64. Qt's clang_64 package is
    # universal, so it can also cross-compile the x86_64 release without the
    # paid macos-14-large runner.
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select compatible Xcode
        run: sudo xcode-select --switch /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          cache: true

      - name: Configure ${{ matrix.arch }} build
        shell: bash
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DBUILD_TESTING=ON
          -DMDR_ENABLE_CODEGEN=OFF

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2

      - name: Test native build
        if: matrix.arch == 'arm64'
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Verify architecture and strip symbols
        run: |
          executable=build/gui/SonyHeadphonesClient.app/Contents/MacOS/SonyHeadphonesClient
          lipo "$executable" -verify_arch ${{ matrix.arch }}
          strip -x "$executable"

      - name: Package DMG
        run: cpack --config build/CPackConfig.cmake -C ${{ env.BUILD_TYPE }} -B dist

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-package
          path: dist/SonyHeadphonesClient-${{ needs.validate.outputs.version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  linux:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbluetooth-dev libdbus-1-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_INSTALL_PREFIX=/usr
          -DBUILD_TESTING=ON
          -DMDR_ENABLE_CODEGEN=OFF

      - name: Build and test
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2
          ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Download linuxdeploy
        run: |
          curl --fail --location --output linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Package AppImage
        run: >
          bash packaging/package_appimage.sh
          build dist ${{ needs.validate.outputs.version }}
          ./linuxdeploy-x86_64.AppImage

      - name: Smoke-test AppImage
        run: |
          chmod +x dist/*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen \
            dist/*.AppImage --preview-profile WH-1000XM6 --capture appimage-smoke.png
          test -s appimage-smoke.png

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/SonyHeadphonesClient-${{ needs.validate.outputs.version }}-x86_64.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, windows, macos, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: "*-package"
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Unsigned Windows, macOS, and Linux packages. Windows SmartScreen and macOS Gatekeeper may display security warnings."
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if ! gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "SonyHeadphonesClient ${GITHUB_REF_NAME}" \
              --notes "${notes}"; then
              # Another run may have created the release between view and create.
              gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null
            fi
          fi
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SonyHeadphonesClient ${GITHUB_REF_NAME}" \
            --notes "${notes}"
          gh release upload "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
